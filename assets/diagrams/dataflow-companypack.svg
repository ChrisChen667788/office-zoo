<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1a1d3a"/>
      <stop offset="60%" stop-color="#10112a"/>
      <stop offset="1" stop-color="#06061a"/>
    </radialGradient>
    <linearGradient id="node3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d1b69"/>
      <stop offset="1" stop-color="#0f0e2e"/>
    </linearGradient>
    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg3)"/>
  <text x="40" y="42" fill="#FFD700" font-size="22" font-weight="800">公司主题包 · 数据闭环</text>
  <text x="40" y="66" fill="rgba(255,255,255,0.45)" font-size="13">建包 → 分享 → 同事开局 → 班味打卡 → 本公司 Top · 数据沿环流动</text>

  <!-- ring path (clockwise ellipse) -->
  <path id="ring" fill="none" stroke="#4ECDC4" stroke-width="2" stroke-dasharray="8 9" opacity="0.55"
        d="M480,150 A330,180 0 0 1 810,330 A330,180 0 0 1 480,510 A330,180 0 0 1 150,330 A330,180 0 0 1 480,150 Z">
    <animate attributeName="stroke-dashoffset" from="0" to="-34" dur="1.1s" repeatCount="indefinite"/>
  </path>

  <!-- traveling data packets around the loop -->
  <circle r="6" fill="#FFD700"><animateMotion dur="7s" repeatCount="indefinite"
      path="M480,150 A330,180 0 0 1 810,330 A330,180 0 0 1 480,510 A330,180 0 0 1 150,330 A330,180 0 0 1 480,150 Z"/></circle>
  <circle r="5" fill="#FF4FA3"><animateMotion dur="7s" begin="3.5s" repeatCount="indefinite"
      path="M480,150 A330,180 0 0 1 810,330 A330,180 0 0 1 480,510 A330,180 0 0 1 150,330 A330,180 0 0 1 480,150 Z"/></circle>

  <!-- nodes around the ring -->
  <g text-anchor="middle">
    <!-- top: 建包 -->
    <g filter="url(#glow3)"><rect x="395" y="118" width="170" height="64" rx="14" fill="url(#node3)" stroke="#FFD700" stroke-width="1.4"/></g>
    <text x="480" y="146" fill="#f4f4ff" font-size="15" font-weight="800">🏢 建包</text>
    <text x="480" y="166" fill="rgba(255,255,255,0.6)" font-size="11">CompanyPackEdit</text>

    <!-- top-right: 持久化 -->
    <g filter="url(#glow3)"><rect x="700" y="180" width="186" height="64" rx="14" fill="url(#node3)" stroke="#4ECDC4" stroke-width="1.4"/></g>
    <text x="793" y="208" fill="#f4f4ff" font-size="15" font-weight="800">💾 持久化</text>
    <text x="793" y="228" fill="rgba(255,255,255,0.6)" font-size="11">companyPacks.json</text>

    <!-- right: 分享链接 -->
    <g filter="url(#glow3)"><rect x="740" y="298" width="170" height="64" rx="14" fill="url(#node3)" stroke="#4ECDC4" stroke-width="1.4"/></g>
    <text x="825" y="326" fill="#f4f4ff" font-size="15" font-weight="800">🔗 分享链接</text>
    <text x="825" y="346" fill="rgba(255,255,255,0.6)" font-size="11">/view/:packId</text>

    <!-- bottom-right: 同事开局 -->
    <g filter="url(#glow3)"><rect x="610" y="430" width="200" height="64" rx="14" fill="url(#node3)" stroke="#B086FF" stroke-width="1.4"/></g>
    <text x="710" y="458" fill="#f4f4ff" font-size="15" font-weight="800">🎮 同事开局</text>
    <text x="710" y="478" fill="rgba(255,255,255,0.6)" font-size="11">game:create · packId</text>

    <!-- bottom: engine override -->
    <g filter="url(#glow3)"><rect x="385" y="488" width="190" height="64" rx="14" fill="url(#node3)" stroke="#B086FF" stroke-width="1.4"/></g>
    <text x="480" y="516" fill="#f4f4ff" font-size="15" font-weight="800">⚙️ 名单覆盖</text>
    <text x="480" y="536" fill="rgba(255,255,255,0.6)" font-size="11">GameEngine override</text>

    <!-- bottom-left: 班味打卡 -->
    <g filter="url(#glow3)"><rect x="150" y="430" width="190" height="64" rx="14" fill="url(#node3)" stroke="#FF4FA3" stroke-width="1.4"/></g>
    <text x="245" y="458" fill="#f4f4ff" font-size="15" font-weight="800">📊 班味打卡</text>
    <text x="245" y="478" fill="rgba(255,255,255,0.6)" font-size="11">banwei.json · lastPackId</text>

    <!-- left: 排行榜 reducer -->
    <g filter="url(#glow3)"><rect x="48" y="298" width="184" height="64" rx="14" fill="url(#node3)" stroke="#FFD700" stroke-width="1.4"/></g>
    <text x="140" y="326" fill="#f4f4ff" font-size="15" font-weight="800">🏆 排行榜</text>
    <text x="140" y="346" fill="rgba(255,255,255,0.6)" font-size="11">leaderboard reducer</text>

    <!-- top-left: 本公司 Top + 卡 -->
    <g filter="url(#glow3)"><rect x="80" y="180" width="190" height="64" rx="14" fill="url(#node3)" stroke="#4ECDC4" stroke-width="1.4"/></g>
    <text x="175" y="208" fill="#f4f4ff" font-size="15" font-weight="800">📤 本公司 Top</text>
    <text x="175" y="228" fill="rgba(255,255,255,0.6)" font-size="11">榜单 + 分享卡 PNG</text>
  </g>

  <!-- center label -->
  <text x="480" y="320" fill="rgba(255,255,255,0.32)" font-size="13" text-anchor="middle" font-style="italic">闭环:观众 → 游戏世界 → 观众</text>
</svg>
