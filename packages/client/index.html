<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- v6.7 brand — favicon suite generated from assets/brand/logo-card.png
         (5★ stigma frame mascot, recognizable silhouette at 16-32px). -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFD700" />

    <!-- Open Graph / Twitter cards — when users share the URL, social
         platforms grab the brand image + tagline instead of an empty card. -->
    <meta property="og:title" content="OFFICE ZOO · 班味剧场" />
    <meta property="og:description" content="0 点的写字楼, AI 鼠人替你拥抱变化, 你回家躺平。" />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OFFICE ZOO · 班味剧场" />
    <meta name="twitter:description" content="AI rats clock in, so you can clock out. Open-source MIT." />
    <meta name="twitter:image" content="/apple-touch-icon.png" />

    <title>OFFICE ZOO · 班味剧场 · 0 点的写字楼</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
